<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TextyLabs 🧪</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --msg-sent: #4f46e5;
      --msg-received: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-main) 60%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    /* Typography & Headers */
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .brand h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-pill {
      font-size: 0.85rem;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
    }

    /* Form Inputs & Buttons */
    input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 8px 20px var(--accent-glow); }
    
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); margin-top: 8px;}
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }

    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-danger:hover { background: var(--danger); color: white; }

    .btn-google {
      background: #ffffff;
      color: #0f172a;
      font-weight: 600;
    }
    .btn-google:hover { background: #f1f5f9; }

    /* Admin Panel */
    .admin-badge {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(217, 119, 6, 0.25));
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .admin-badge h3 { font-size: 0.9rem; color: #fbbf24; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .admin-badge p { font-size: 0.8rem; color: #fef3c7; }

    /* Chat Room Interface */
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 16px;
    }

    .code-pill {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      padding: 6px 12px;
      border-radius: 8px;
      font-family: monospace;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      border: 1px dashed var(--accent);
    }

    .owner-bar {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
    }

    #chat-box {
      height: 340px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 6px;
      margin-bottom: 16px;
    }

    #chat-box::-webkit-scrollbar { width: 5px; }
    #chat-box::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg-mine {
      align-self: flex-end;
      background: var(--msg-sent);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg-other {
      align-self: flex-start;
      background: var(--msg-received);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .msg-sender {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .disabled-notice {
      text-align: center;
      padding: 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 12px;
      color: #fca5a5;
      font-size: 0.85rem;
    }

    /* Dynamic Toast */
    .toast {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="app-container">
  <div id="toast" class="toast">Code copied!</div>

  <!-- App Header -->
  <div class="brand">
    <h1>TextyLabs 🧪</h1>
    <div id="user-badge" class="user-pill hidden"></div>
  </div>

  <!-- LOGIN SECTION -->
  <div id="login-sec">
    <p style="color: var(--text-secondary); margin-bottom: 20px; font-size: 0.95rem;">
      Real-time group chats made simple. Sign in to start or join a lab.
    </p>
    <button id="login-btn" class="btn btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Sign in with Google
    </button>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dash-sec" class="hidden">
    <!-- Admin Panel Badge -->
    <div id="admin-panel" class="admin-badge hidden">
      <h3>👑 System Owner Panel</h3>
      <p>Authorized access granted. You have system level admin controls.</p>
    </div>

    <div style="margin-bottom: 20px;">
      <input type="text" id="join-code-input" placeholder="Enter 6-digit room code" maxlength="6" style="text-transform: uppercase;">
      <button id="join-chat-btn" class="btn btn-primary">Join Group Chat</button>
    </div>

    <div style="border-top: 1px solid var(--card-border); padding-top: 16px;">
      <button id="create-chat-btn" class="btn btn-secondary">⚡ Create New Group Chat</button>
      <button id="logout-btn" class="btn btn-secondary" style="color: #fca5a5;">Logout</button>
    </div>
  </div>

  <!-- CHAT ROOM SECTION -->
  <div id="chat-sec" class="hidden">
    <div class="chat-header">
      <button id="leave-chat-btn" class="btn-secondary" style="padding: 6px 12px; border-radius: 10px; border:none; cursor:pointer;">← Back</button>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 0.85rem; color: var(--text-secondary);">Code:</span>
        <span id="current-chat-code" class="code-pill" title="Click to copy">------</span>
      </div>
    </div>

    <!-- Owner Only Controls -->
    <div id="owner-controls" class="owner-bar hidden">
      <button id="toggle-texting-btn" class="btn btn-secondary" style="margin: 0; font-size: 0.8rem; padding: 8px;">Disable Chat</button>
      <button id="delete-chat-btn" class="btn btn-danger" style="margin: 0; font-size: 0.8rem; padding: 8px;">Delete Room</button>
    </div>

    <div id="chat-box"></div>

    <div id="texting-disabled-msg" class="disabled-notice hidden">
      🚫 The chat owner has disabled messaging.
    </div>

    <div id="message-input-area" style="display: flex; gap: 8px;">
      <input type="text" id="message-input" placeholder="Type a message..." style="margin: 0;">
      <button id="send-btn" class="btn btn-primary" style="width: auto; padding: 0 20px;">Send</button>
    </div>
  </div>

</div>

<!-- FIREBASE LOGIC -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getDatabase, ref, set, push, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
    authDomain: "nexus-web-development-official.firebaseapp.com",
    databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
    projectId: "nexus-web-development-official",
    storageBucket: "nexus-web-development-official.firebasestorage.app",
    messagingSenderId: "553556577139",
    appId: "1:553556577139:web:ea4469b06c2c01cc999306"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let currentUser = null;
  let currentChatId = null;
  let chatMetaUnsub = null;
  let chatMsgUnsub = null;

  const ADMIN_EMAILS = [
    "jcruz016@stpaul.k12.mn.us",
    "brodywilliams0226@gmail.com"
  ];

  // DOM Elements
  const els = {
    loginSec: document.getElementById('login-sec'),
    dashSec: document.getElementById('dash-sec'),
    chatSec: document.getElementById('chat-sec'),
    adminPanel: document.getElementById('admin-panel'),
    userBadge: document.getElementById('user-badge'),
    chatBox: document.getElementById('chat-box'),
    msgInput: document.getElementById('message-input'),
    ownerControls: document.getElementById('owner-controls'),
    toggleTextingBtn: document.getElementById('toggle-texting-btn'),
    textingDisabledMsg: document.getElementById('texting-disabled-msg'),
    msgInputArea: document.getElementById('message-input-area'),
    chatCodeDisplay: document.getElementById('current-chat-code'),
    toast: document.getElementById('toast')
  };

  // --- AUTHENTICATION ---
  document.getElementById('login-btn').addEventListener('click', () => {
    signInWithPopup(auth, new GoogleAuthProvider()).catch(console.error);
  });

  document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      els.userBadge.textContent = user.displayName;
      els.userBadge.classList.remove('hidden');
      
      els.loginSec.classList.add('hidden');
      els.dashSec.classList.remove('hidden');
      els.chatSec.classList.add('hidden');

      if (ADMIN_EMAILS.includes(user.email.toLowerCase())) {
        els.adminPanel.classList.remove('hidden');
      } else {
        els.adminPanel.classList.add('hidden');
      }
    } else {
      currentUser = null;
      els.userBadge.classList.add('hidden');
      els.loginSec.classList.remove('hidden');
      els.dashSec.classList.add('hidden');
      els.chatSec.classList.add('hidden');
    }
  });

  // --- DASHBOARD ACTIONS ---
  document.getElementById('create-chat-btn').addEventListener('click', async () => {
    const code = Math.random().toString(36).substring(2, 8).toUpperCase();
    
    // Write directly into textylabs node matching Firebase rules
    await set(ref(db, `textylabs/chats/${code}/metadata`), {
      ownerUid: currentUser.uid,
      textingEnabled: true,
      createdAt: Date.now()
    });

    joinChatRoom(code, { ownerUid: currentUser.uid, textingEnabled: true });
  });

  document.getElementById('join-chat-btn').addEventListener('click', async () => {
    const code = document.getElementById('join-code-input').value.trim().toUpperCase();
    if (!code) return showToast("Enter a room code!");

    const snap = await get(ref(db, `textylabs/chats/${code}/metadata`));
    if (!snap.exists()) return showToast("Room not found!");

    joinChatRoom(code, snap.val());
  });

  // --- CHAT ROOM LOGIC ---
  function joinChatRoom(code, metadata) {
    currentChatId = code;
    els.dashSec.classList.add('hidden');
    els.chatSec.classList.remove('hidden');
    els.chatCodeDisplay.textContent = code;
    els.chatBox.innerHTML = '';

    const isSystemAdmin = ADMIN_EMAILS.includes(currentUser.email.toLowerCase());
    const isOwner = currentUser.uid === metadata.ownerUid || isSystemAdmin;

    if (isOwner) {
      els.ownerControls.classList.remove('hidden');
    } else {
      els.ownerControls.classList.add('hidden');
    }

    // Unsubscribe existing listeners
    if (chatMetaUnsub) chatMetaUnsub();
    if (chatMsgUnsub) chatMsgUnsub();

    // Metadata Listener
    chatMetaUnsub = onValue(ref(db, `textylabs/chats/${code}/metadata`), (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        showToast("Room was deleted.");
        leaveChat();
        return;
      }
      
      if (data.textingEnabled) {
        els.msgInputArea.classList.remove('hidden');
        els.textingDisabledMsg.classList.add('hidden');
        els.toggleTextingBtn.textContent = "Disable Chat";
      } else {
        els.msgInputArea.classList.add('hidden');
        els.textingDisabledMsg.classList.remove('hidden');
        els.toggleTextingBtn.textContent = "Enable Chat";
      }
    });

    // Message Listener
    chatMsgUnsub = onValue(ref(db, `textylabs/chats/${code}/messages`), (snapshot) => {
      els.chatBox.innerHTML = '';
      snapshot.forEach((childSnap) => {
        const msg = childSnap.val();
        const div = document.createElement('div');
        const isMe = msg.uid === currentUser.uid;
        
        div.className = `msg ${isMe ? 'msg-mine' : 'msg-other'}`;
        div.innerHTML = `
          ${!isMe ? `<div class="msg-sender">${msg.sender}</div>` : ''}
          <div>${escapeHTML(msg.text)}</div>
        `;
        els.chatBox.appendChild(div);
      });
      els.chatBox.scrollTop = els.chatBox.scrollHeight;
    });
  }

  // Send Message
  document.getElementById('send-btn').addEventListener('click', sendMessage);
  els.msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

  function sendMessage() {
    const text = els.msgInput.value.trim();
    if (!text || !currentChatId) return;

    push(ref(db, `textylabs/chats/${currentChatId}/messages`), {
      sender: currentUser.displayName,
      uid: currentUser.uid,
      text: text,
      timestamp: Date.now()
    });
    els.msgInput.value = '';
  }

  // Leave Chat
  document.getElementById('leave-chat-btn').addEventListener('click', leaveChat);
  
  function leaveChat() {
    if (chatMetaUnsub) chatMetaUnsub();
    if (chatMsgUnsub) chatMsgUnsub();
    currentChatId = null;
    els.chatSec.classList.add('hidden');
    els.dashSec.classList.remove('hidden');
  }

  // Owner Controls
  document.getElementById('delete-chat-btn').addEventListener('click', async () => {
    if (confirm("Delete this group chat for everyone?")) {
      await remove(ref(db, `textylabs/chats/${currentChatId}`));
      leaveChat();
    }
  });

  document.getElementById('toggle-texting-btn').addEventListener('click', async () => {
    const snap = await get(ref(db, `textylabs/chats/${currentChatId}/metadata/textingEnabled`));
    await update(ref(db, `textylabs/chats/${currentChatId}/metadata`), {
      textingEnabled: !snap.val()
    });
  });

  // Copy Code Click
  els.chatCodeDisplay.addEventListener('click', () => {
    navigator.clipboard.writeText(currentChatId);
    showToast("Code copied to clipboard!");
  });

  // Helpers
  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    setTimeout(() => els.toast.classList.remove('show'), 2000);
  }

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }
</script>
</body>
</html>
